# This workflow runs whenever a PR is opened or updated, or a commit is pushed to main. It runs
# several checks:
# - fmt: checks that the code is formatted according to rustfmt
# - clippy: checks that the code does not contain any clippy warnings
# - doc: checks that the code can be documented without errors
# - hack: check combinations of feature flags
# - semver: checks pull requests for undeclared public-API breakage
# - package: checks that both crates can be packaged for crates.io and built from the package
# - msrv: check that the msrv specified in the crate is correct
permissions:
  contents: read
# This configuration allows maintainers of this repo to create a branch and pull request based on
# the new branch. Restricting the push trigger to the main branch ensures that the PR only gets
# built once.
on:
  push:
    branches: [main]
  pull_request:
# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: check
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: stable / fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check
  clippy:
    runs-on: ubuntu-latest
    name: ${{ matrix.toolchain }} / clippy
    strategy:
      fail-fast: false
      matrix:
        # Get early warning of new lints which are regularly introduced in beta channels.
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh --vendored-libs
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      # Run clippy directly rather than through an annotation action: those report findings as
      # review comments but pass the job regardless, even when clippy itself fails to build.
      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    runs-on: ubuntu-latest
    name: nightly / doc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh --vendored-libs
      - name: Install nightly
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: nightly
      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs
  semver:
    # cargo-semver-checks compares the public API of this PR against its base revision, so API
    # breakage has to be deliberate: the job fails unless the crate version was bumped to match.
    # Its lints are structural (removed or renamed items, changed arity, and so on), not an
    # exhaustive type-level diff.
    runs-on: ubuntu-latest
    name: stable / semver-checks
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
          fetch-depth: 0
      - name: Configure CI host
        run: ./configure-ci.sh --vendored-libs
      - name: Install stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: stable
      - name: cargo install cargo-semver-checks
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # tag=v2.87.21
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks
        env:
          # The baseline is built from a scratch checkout without the vendored submodule, so point
          # the header lookup at the headers configure-ci.sh published (mirroring its values as
          # real environment variables, which apply to the baseline build too).
          RDMA_CORE_INCLUDE_DIR: ${{ github.workspace }}/rdma-core-build/include
          RDMA_CORE_LIB_DIR: ${{ github.workspace }}/rdma-core-build/lib
        run: cargo semver-checks --package ibverbs --baseline-rev ${{ github.event.pull_request.base.sha }}
  package:
    # Packaging fails in ways the normal build does not: a path dependency whose registry version
    # lacks a feature, a file the build needs but the package excludes, a version left unbumped
    # next to its bumped dependency. Package both crates in one go (cargo resolves the
    # intra-workspace dependency against the local crate) and build what was packaged, with the
    # vendored rdma-core headers as a crates.io consumer would.
    runs-on: ubuntu-latest
    name: ubuntu / stable / package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Install libibverbs and the build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libibverbs-dev clang
      - name: Install stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: stable
      - name: cargo package --workspace
        run: cargo package --workspace --locked
  hack:
    # cargo-hack checks combinations of feature flags to ensure that features are all additive
    # which is required for feature unification
    runs-on: ubuntu-latest
    name: ubuntu / stable / features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh --vendored-libs
      - name: Install stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: stable
      - name: cargo install cargo-hack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # tag=v2.87.21
        with:
          tool: cargo-hack
      # intentionally no target specifier; see https://github.com/jonhoo/rust-ci-conf/pull/4
      # --feature-powerset runs for every combination of features
      - name: cargo hack
        run: cargo hack --feature-powerset check
  msrv:
    # check that we can build using the minimal rust version that is specified by this crate
    runs-on: ubuntu-latest
    # we use a matrix here just because env can't be used in job names
    # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
    strategy:
      matrix:
        msrv: ["1.85.0"] # edition 2024 (see ibverbs-sys/Cargo.toml)
    name: ubuntu / ${{ matrix.msrv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh --vendored-libs
      # The MSRV is what this crate _could_ build with if its dependencies were downgraded as far as
      # Cargo.toml allows, not whatever the newest release of each dependency happens to need. So
      # rather than build against the latest (or committed) dependency versions, we re-resolve with
      # the MSRV-aware resolver, which picks the newest versions whose `rust-version` is compatible
      # with `package.rust-version`. That resolver needs cargo 1.84+, which the MSRV toolchain need
      # not be, so we resolve with stable and only build with the MSRV toolchain. Stable is
      # installed first so that the MSRV toolchain ends up as the default.
      - name: Install stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: stable
      - name: Install ${{ matrix.msrv }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # branch=master
        with:
          toolchain: ${{ matrix.msrv }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo
      # The resolver targets `package.rust-version`, not the toolchain in the matrix, so warn if the
      # two have drifted apart. Without a `rust-version`, the resolver targets stable instead, so
      # dependencies aren't downgraded at all.
      - name: Check that rust-version matches ${{ matrix.msrv }}
        run: |
          rvs=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[].rust_version // empty' | sort -u | paste -sd ' ' -)
          if [ -z "$rvs" ]; then
            echo "::warning::no package sets rust-version, so dependencies will not be resolved to MSRV-compatible versions"
            exit 0
          fi
          for rv in $rvs; do
            case "${{ matrix.msrv }}" in "$rv" | "$rv".*) exit 0 ;; esac
          done
          echo "::warning::msrv in check.yml (${{ matrix.msrv }}) does not match any package rust-version ($rvs)"
      # We use generate-lockfile rather than update since update keeps the format version of an
      # existing Cargo.lock, and cargo older than 1.78 cannot read the v4 format. generate-lockfile
      # instead picks a format that `rust-version` can read.
      - name: cargo +stable generate-lockfile (MSRV-aware)
        run: cargo +stable generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      # --locked so that an older cargo fails loudly rather than quietly re-resolving if it cannot
      # use the versions picked above (e.g., because it cannot parse their index entries).
      - name: cargo +${{ matrix.msrv }} check
        run: cargo +${{ matrix.msrv }} check --locked
      - name: cargo +${{ matrix.msrv }} check --no-default-features --features mlx5
        run: cargo +${{ matrix.msrv }} check --locked --no-default-features --features mlx5
      - name: cargo +${{ matrix.msrv }} check --all-features --all-targets
        run: cargo +${{ matrix.msrv }} check --locked --all-features --all-targets
