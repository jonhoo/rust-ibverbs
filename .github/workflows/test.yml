# This is the main CI workflow that runs the test suite on all pushes to main and all pull requests.
# It runs the following jobs:
# - required: runs the test suite on ubuntu with stable and beta rust toolchains
# - minimal: runs the test suite with the minimal versions of the dependencies that satisfy the
#   requirements of this crate, and its dependencies
# - vendored: builds with the vendored rdma-core headers, the way a crates.io consumer does
# - integration: runs the ignored data-path tests against a Soft-RoCE (rxe) device
# - coverage: runs the test suite and collects coverage information
# See check.yml for information about how the concurrency cancellation and workflow triggering works
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: test
jobs:
  required:
    runs-on: ubuntu-latest
    name: ubuntu / ${{ matrix.toolchain }}
    strategy:
      matrix:
        # run on stable and beta to ensure that tests won't break on the next version of the rust
        # toolchain
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: cargo generate-lockfile
        # enable this ci template to run regardless of whether the lockfile is checked in or not
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      # https://twitter.com/jonhoo/status/1571290371124260865
      - name: cargo test --locked
        run: cargo test --locked --all-features --all-targets
      # https://github.com/rust-lang/cargo/issues/6669
      - name: cargo test --doc
        run: cargo test --locked --all-features --doc
  vendored:
    # Build the way a crates.io consumer does: with no RDMA_CORE_INCLUDE_DIR / IBVERBS_HEADER_DIR,
    # ibverbs-sys configures the vendored rdma-core checkout with cmake and binds against the
    # headers that generates. The host's rdma-core headers are deleted first (only the runtime
    # libraries and their link-time symlinks stay), so this can only pass if the vendored headers
    # really are the ones in use.
    runs-on: ubuntu-latest
    name: ubuntu / stable / vendored-headers
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the libraries and build tools, then remove the host headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libibverbs-dev librdmacm-dev clang cmake
          sudo rm -rf /usr/include/infiniband /usr/include/rdma
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo build --all-features --all-targets
        run: cargo build --locked --all-features --all-targets
      - name: cargo test --all-features
        run: cargo test --locked --all-features
  integration:
    # Exercise the data path against a real RDMA device. The integration tests are #[ignore]d
    # because they need a device, so the rest of CI only compile-checks them. Here we stand up a
    # Soft-RoCE (rxe) device by building the rdma_rxe kernel module from the Ubuntu source package
    # of the running kernel (the runner's own kernel ships only siw) and attaching it to the
    # runner's network interface, then run the ignored tests against it.
    #
    # The tests run against the vendored rdma-core built in place, not the distribution's: the
    # rxe provider in rdma-core 50 (what ubuntu-24.04 ships) advances the completion queue's
    # consumer index once too often when a poll drains the queue, after which the kernel sees the
    # queue as full and drops the next completion. The vendored version has the fix, and is also
    # the one the bindings are generated from.
    runs-on: ubuntu-latest
    name: ubuntu / stable / soft-roce
    env:
      # Link and load the in-place rdma-core build (libibverbs, its providers, and librdmacm).
      RDMA_CORE_LIB_DIR: ${{ github.workspace }}/rdma-core-build/lib
      LD_LIBRARY_PATH: ${{ github.workspace }}/rdma-core-build/lib
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh
      - name: Build the vendored rdma-core in place
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libnl-3-dev libnl-route-3-dev
          cmake -S ibverbs-sys/vendor/rdma-core -B rdma-core-build \
            -DIN_PLACE=1 -DNO_MAN_PAGES=1 -DNO_PYVERBS=1 -DCMAKE_BUILD_TYPE=Release
          cmake --build rdma-core-build -j"$(nproc)"
          ls rdma-core-build/lib/libibverbs.so* rdma-core-build/lib/librdmacm.so* \
            rdma-core-build/lib/librxe-rdmav*.so
      - name: Set up a Soft-RoCE (rxe) device
        run: |
          set -euxo pipefail
          # Enable source packages so the running kernel's own source can be fetched.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-headers-"$(uname -r)" build-essential libelf-dev dwarves dpkg-dev patchutils \
            ibverbs-providers ibverbs-utils iproute2
          mkdir ksrc && cd ksrc
          # Ask for the modules package's source: the image package resolves to the tiny signing
          # wrapper package instead. Prefer the running kernel's exact version, and fall back to
          # whatever the archive currently carries if that one has been superseded.
          modules=linux-modules-"$(uname -r)"
          version=$(dpkg-query -W -f='${Version}' "$modules")
          apt-get source --download-only "$modules=$version" \
            || apt-get source --download-only "$modules"
          ls -l
          # The source package is the upstream tarball plus one distribution diff. Unpack only the
          # rxe driver from the tarball and apply just that directory's part of the diff.
          tar -xf ./*.orig.tar.* --wildcards --strip-components=1 '*/drivers/infiniband/sw/rxe/*'
          if ls ./*.diff.gz >/dev/null 2>&1; then
            zcat ./*.diff.gz | filterdiff -p1 -i 'drivers/infiniband/sw/rxe/*' | patch -p1 --forward
          fi
          cd drivers/infiniband/sw/rxe
          # Turn the in-tree build file into an out-of-tree module build forced on.
          mv Makefile Kbuild
          sed -i 's/$(CONFIG_RDMA_RXE)/m/g' Kbuild
          make -C "/lib/modules/$(uname -r)/build" M="$PWD" modules
          sudo mkdir -p "/lib/modules/$(uname -r)/extra"
          sudo cp rdma_rxe.ko "/lib/modules/$(uname -r)/extra/"
          sudo depmod -a
          sudo modprobe rdma_rxe
          # librdmacm reaches the kernel connection manager through rdma_ucm; load it explicitly
          # rather than relying on the first rdma_cm open to autoload it.
          sudo modprobe rdma_ucm
          # The runner's own NIC is an RDMA device as well (a Mellanox VF or a MANA adapter,
          # depending on the VM generation). A MANA one shares eth0, and so its IP, with the rxe
          # device attached below, and the connection manager then resolves connections onto it
          # instead of rxe0 (its provider has no extended verbs). Unbind both from RDMA so rxe0 is
          # the only device; networking stays up on the netdev drivers.
          for module in mana_ib mlx5_ib; do
            sudo modprobe -r "$module" 2>/dev/null || true
          done
          netdev=$(ip -o -4 route show to default | awk '{print $5; exit}')
          echo "Attaching rxe0 to $netdev"
          sudo rdma link add rxe0 type rxe netdev "$netdev"
          rdma link
          # Through the in-place build, so this also proves its rxe provider finds the device.
          "$GITHUB_WORKSPACE"/rdma-core-build/bin/ibv_devices
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo test -- --ignored
        env:
          IBVERBS_TEST_DEVICE: rxe0
        # Run serially: the tests share one rxe device, and Soft-RoCE drops completions when many
        # queue pairs drive it concurrently.
        run: cargo test --locked --test loopback -- --ignored --test-threads=1
      - name: cargo test --features rdmacm -- --ignored
        env:
          IBVERBS_TEST_DEVICE: rxe0
        # The connection manager binds the runner's own IPv4 address, which resolves onto the same
        # rxe device. Serial for the same reason as the loopback tests.
        run: cargo test --locked --features rdmacm --test rdmacm -- --ignored --test-threads=1
      - name: Dump the RDMA state
        # The device is set up from scratch on every run, so when a test fails the interesting
        # evidence is what the kernel and the device looked like at that moment.
        if: failure()
        run: |
          rdma link || true
          ip -4 addr || true
          ls -l /dev/infiniband || true
          lsmod | grep -E '^(rdma|ib_|rxe)' || true
          "$GITHUB_WORKSPACE"/rdma-core-build/bin/ibv_devinfo -v || true
          sudo dmesg | tail -n 60 || true
  minimal:
    # This action chooses the oldest version of the dependencies permitted by Cargo.toml to ensure
    # that this crate is compatible with the minimal version that this crate and its dependencies
    # require. This will pickup issues where this create relies on functionality that was introduced
    # later than the actual version specified (e.g., when we choose just a major version, but a
    # method was added after this version).
    #
    # This particular check can be difficult to get to succeed as often transitive dependencies may
    # be incorrectly specified (e.g., a dependency specifies 1.0 but really requires 1.1.5). There
    # is an alternative flag available -Zdirect-minimal-versions that uses the minimal versions for
    # direct dependencies of this crate, while selecting the maximal versions for the transitive
    # dependencies. Alternatively, you can add a line in your Cargo.toml to artificially increase
    # the minimal dependency, which you do with e.g.:
    # ```toml
    # # for minimal-versions
    # [target.'cfg(any())'.dependencies]
    # openssl = { version = "0.10.55", optional = true } # needed to allow foo to build with -Zminimal-versions
    # ```
    # The optional = true is necessary in case that dependency isn't otherwise transitively required
    # by your library, and the target bit is so that this dependency edge never actually affects
    # Cargo build order. See also
    # https://github.com/jonhoo/fantoccini/blob/fde336472b712bc7ebf5b4e772023a7ba71b2262/Cargo.toml#L47-L49.
    # This action is run on ubuntu with the stable toolchain, as it is not expected to fail
    runs-on: ubuntu-latest
    name: ubuntu / stable / minimal-versions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install nightly for -Zminimal-versions
        uses: dtolnay/rust-toolchain@nightly
      - name: rustup default stable
        run: rustup default stable
      - name: cargo update -Zminimal-versions
        run: cargo +nightly update -Zminimal-versions
      - name: cargo test
        run: cargo test --locked --all-features --all-targets
  coverage:
    # use llvm-cov to build and collect coverage and outputs in a format that
    # is compatible with codecov.io
    #
    # note that codecov as of v4 requires that CODECOV_TOKEN from
    #
    #   https://app.codecov.io/gh/<user or org>/<project>/settings
    #
    # is set in two places on your repo:
    #
    # - https://github.com/jonhoo/guardian/settings/secrets/actions
    # - https://github.com/jonhoo/guardian/settings/secrets/dependabot
    #
    # (the former is needed for codecov uploads to work with Dependabot PRs)
    #
    # PRs coming from forks of your repo will not have access to the token, but
    # for those, codecov allows uploading coverage reports without a token.
    # it's all a little weird and inconvenient. see
    #
    #   https://github.com/codecov/feedback/issues/112
    #
    # for lots of more discussion
    runs-on: ubuntu-latest
    name: ubuntu / stable / coverage
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure CI host
        run: ./configure-ci.sh
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: cargo install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - name: Record Rust version
        run: echo "RUST=$(rustc --version)" >> "$GITHUB_ENV"
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS,RUST
