[package]
name = "ibverbs-sys"
version = "0.3.2+65.0"
edition = "2024"
rust-version = "1.85" # edition 2024

description = "Raw, FFI bindings for RDMA ibverbs through rdma-core"
readme = "../README.md"
authors = [
    "Jon Gjengset <jon@thesquareplanet.com>",
    "Jonathan Behrens <fintelia@gmail.com>",
]
links = "ibverbs"

homepage = "https://github.com/jonhoo/rust-ibverbs"
repository = "https://github.com/jonhoo/rust-ibverbs.git"

keywords = ["rdma", "ibverbs", "networking", "ffi"]
categories = ["network-programming", "api-bindings"]

license = "MIT OR Apache-2.0"

# The crate itself and its license files, and the vendored rdma-core headers `build.rs` generates
# the bindings from (its `VENDORED_HEADERS`), with rdma-core's license files.
include = [
    "/build.rs",
    "/src/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/vendor/rdma-core/COPYING*",
    "/vendor/rdma-core/libibverbs/verbs.h",
    "/vendor/rdma-core/libibverbs/verbs_api.h",
    "/vendor/rdma-core/libibverbs/sa.h",
    "/vendor/rdma-core/libibverbs/tm_types.h",
    "/vendor/rdma-core/kernel-headers/rdma/ib_user_ioctl_verbs.h",
    "/vendor/rdma-core/kernel-headers/rdma/ib_user_verbs.h",
    "/vendor/rdma-core/kernel-headers/rdma/mlx5_user_ioctl_verbs.h",
    "/vendor/rdma-core/kernel-headers/linux/stddef.h",
    "/vendor/rdma-core/providers/efa/efadv.h",
    "/vendor/rdma-core/providers/mlx5/mlx5dv.h",
    "/vendor/rdma-core/providers/mlx5/mlx5_api.h",
    "/vendor/rdma-core/librdmacm/rdma_cma.h",
]

[package.metadata.docs.rs]
all-features = true

[features]
# Bind and link the EFA provider direct-verbs (`efadv`), for AWS Elastic Fabric Adapter SRD queue
# pairs. Requires `libefa` at build and run time.
efa = []
# Bind and link mlx5 direct verbs for DMA-BUF registration and Data Direct device queries.
# Requires `libmlx5` from rdma-core 54+ at build and run time.
mlx5 = []
# Bind and link the RDMA connection manager (`librdmacm`, `rdma_cma.h`). Requires `librdmacm` at
# build and run time.
rdmacm = []

# to make -Zminimal-versions work
[target.'cfg(any())'.dependencies]
proc-macro2 = "1.0.80"

[build-dependencies]
bindgen = "0.72"
